name: quarter-hour-observation

on:
  workflow_dispatch:
  schedule:
    # Four samples/hour, intentionally offset from the top of the hour.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: chain-observatory-quarter-hour
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test collector before writing data
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Collect real network observations
        id: collect
        env:
          PYTHONPATH: src
        run: |
          set +e
          python scripts/collect.py --config config/networks.json --out data/observations
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "No successful observation; ending without commit."
            echo "has_data=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          echo "has_data=true" >> "$GITHUB_OUTPUT"

      - name: Validate generated observation data
        if: steps.collect.outputs.has_data == 'true'
        env:
          PYTHONPATH: src
        run: python scripts/validate_data.py

      - name: Build reproducible reports and rollups
        if: steps.collect.outputs.has_data == 'true'
        env:
          PYTHONPATH: src
        run: python scripts/build_report.py

      - name: Commit only substantive generated data
        if: steps.collect.outputs.has_data == 'true'
        env:
          COMMIT_NAME: ${{ vars.COMMIT_NAME }}
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}
        run: |
          if [ -z "$COMMIT_EMAIL" ]; then
            echo "Repository variable COMMIT_EMAIL is required."
            exit 1
          fi
          if [ -z "$COMMIT_NAME" ]; then
            COMMIT_NAME="khenzarr"
          fi

          if [ -z "$(git status --porcelain -- data/ reports/ metrics/)" ]; then
            echo "No generated changes; no commit."
            exit 0
          fi

          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"
          git add data/ reports/ metrics/ || true

          if git diff --cached --quiet; then
            echo "Nothing staged; no commit."
            exit 0
          fi

          stamp="$(date -u +'%Y-%m-%dT%H:%MZ')"
          git commit -m "obs(auto): sample six EVM networks ${stamp}"

          # A scheduled run can overlap a recently pushed observation. Rebase the
          # generated commit on the newest main before pushing instead of forcing.
          git pull --rebase origin main
          git push origin HEAD:main
